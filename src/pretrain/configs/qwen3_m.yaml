# QWEN3-1.7B M-TIER, PURE GQA: the standard-architecture arm (2026-08-13).
#
# WHY. Everything the campaign has shown about stale-delta fp8 attention was measured on a Qwen3.5
# GDN HYBRID in which only 6 of 24 layers are attention: quantized attention is 25% of the network.
# "Standard architecture + fully quantized attention backward" is a contribution prior work leaves
# open, and strictly a 3:1 GatedDeltaNet hybrid is not a standard architecture.
# This config is the standard transformer: every layer is attention.
#
# ARCHITECTURE = Qwen3-1.7B exactly, EXCEPT tokenizer/embedding.
#   hidden 2048 · 28 layers · 16 q heads · 8 kv heads · head_dim 128 · intermediate 6144
#   rope_theta 1e6 · rms_norm_eps 1e-6 · tied embeddings · qk_norm
#   NO attn_output_gate, NO partial rotary  (both are Qwen3-Next/3.5 idioms, absent from Qwen3)
#
# VOCAB is Llama-2 32k, not Qwen3's 151936: the corpus (nemotron_rs, 40.47B tokens) is tokenized
# with it and byte-verified on every node; re-tokenizing 40B tokens buys nothing here. That drops
# the embedding from 311M to 65.5M, so this is 1.475B rather than Qwen3-1.7B's 1.72B. The layer
# stack (the part the experiment is about) is identical.
#
# head_dim 128 MATTERS BEYOND FIDELITY. The fp8 attention kernel's block-scale contract is [128, 64]
# (Q/dO rows, K/V keys per scale) at head_dim 128 and [64, 32] at head_dim 256.
#
# TOKEN BUDGET matches the hybrid M-tier grid exactly (GBS 128 x 8192 = 1.0486M tok/step,
# 28610 steps = 30.0B tokens), so this arm sits on the same axis as the hybrid results even though
# the architectures differ.
#
# LR = 2.4e-3, SET BY A SWEEP ON A 0.18 B PROXY OF THIS ARCHITECTURE (12 layers, d_model 1024; seed 11785, 19073 steps / 10.0B tokens,
# val CE at 128 windows):
#     3e-4 -> 1.9000 · 1.2e-3 -> 1.8863 · 2.4e-3 -> 1.8649 · 4.8e-3 -> 1.8692 · 9.6e-3 -> 1.8847
# The argmin is 2.4e-3 and it is INTERIOR: the curve rises on both sides. That is the difference
# from the Qwen3.5 sweep this replaces, whose argmin landed on 4.8e-3, the EDGE of its grid, so it
# could not bracket its own optimum. The 9.6e-3 cell was added here for exactly
# that reason and it loses, which is what licenses calling 2.4e-3 an optimum rather than a boundary.
# 2.4e-3 beats its nearest rival 4.8e-3 by 0.0043 nll, ~7x the paired SE at 128 windows.
#
# That this lands on the same value the Qwen3.5 hybrid used is a coincidence worth stating plainly:
# it was NOT inherited. The hybrid's 2.4e-3 was chosen on a different architecture with a
# matched-delta fp8 arm; this one is measured on the architecture it will be used for.
run_name: qwen3_m
backend: fsdp2

global_batch_size: 128
per_device_batch_size: 2        # ga 8 at 8 GPUs -> GBS 128 exact
num_steps: 28610                # 30.0B tokens, same budget as the Qwen3.5 M-tier grid
hf_export_steps: []

gradient_checkpointing: true
ac_mode: selective
fused_ce: true
compile: false
fp8: false
bf16: true

save_interval: 1500
save_total_limit: 2
seed: 11785
hf_save_dir:   workspace/qwen3_m/hf
ckpt_root_dir: workspace/qwen3_m/ckpts
log_root_dir:  workspace/logs

model:
  vocab_size: 32000             # Llama-2 32k, NOT Qwen3's 151936: see header
  d_model: 2048
  n_layers: 28
  n_heads: 16
  n_kv_heads: 8
  head_dim: 128
  max_seq_len: 8192
  mixer: gqa                    # PURE attention. layer_mixers intentionally ABSENT.
  intermediate_size: 6144
  attn_output_gate: false
  partial_rotary_factor: 1.0
  qk_norm: true
  attn_impl: sdpa
  rope_theta: 1000000.0
  norm_eps: 1.0e-6
  tie_embeddings: true
  z_loss_weight: 1.0e-4

optim:
  lr: 2.4e-3                    # the proxy sweep's winner (see header)
  betas: [0.9, 0.95]
  weight_decay: 0.1
  max_grad_norm: 1.0
  lr_scheduler_type: wsd
  warmup_ratio: 0.0333
  decay_ratio: 0.2
  decay_type: linear

data:
  paths:       workspace/data/nemotron_cc_v2d1_hq_dqa/nemotron_rs_train.bin
  doc_lengths: workspace/data/nemotron_cc_v2d1_hq_dqa/nemotron_rs_train.doc_lengths.npy
  dtype: uint16
  position_mode: packed
  seed: 11785
