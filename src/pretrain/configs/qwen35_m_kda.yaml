# 3:1 KDA (Kimi Delta Attention) : GQA hybrid, the 1.665 B twin of qwen35_m.yaml at head_dim 128 (2026-09-22; modeling/kda.py
# wrapping fla.layers.kda.KimiDeltaAttention on fla's dedicated chunk kernels). Every recurrent layer is KDA with the GDN cell's
# linear geometry (16 heads x 128, short conv 4) at fla's KDA default expand_v 1.0 (value width = key width, Kimi Linear's design;
# fla's GatedDeltaNet uses 2.0), so a KDA layer carries 17.9 M parameters against a GatedDeltaNet layer's 33.7 M at this width.
# PARAMETER MATCHING (the campaign's method, as the Mamba2 twin): the FFN widens from 6144 to 8064 (a multiple of 64): total
# 1,664,776,224 against the GDN:GQA twin's 1,665,442,368 (-0.040 %). The alternative kda_expand_v 2.0 with FFN 6848 gives
# -0.029 % with a GDN-like value width; this yaml keeps Kimi Linear's expand_v 1. The 6 attention layers are the 16q/4kv
# head_dim-128 GQA of the GDN cell (cuDNN bf16 for the clean arm; dm + Delta-Matching-128 for the stale and matched arms,
# set by the launcher). Arms: kda_clean_hd128, kda_dm_stale_hd128, kda_dm_matched_hd128.
run_name: qwen35_m_kda
backend: fsdp2
global_batch_size: 128
per_device_batch_size: 4   # 2026-09-19: 2 -> 4, so grad_accum = 128/(8*4) = 4 instead of 8.
                           # global_batch_size stays 128, so tokens/step (1,048,576), the 30.0B budget,
                           # the WSD schedule and the data order are all unchanged: this is a pure
                           # micro-batching/throughput change and the runs stay comparable to the GDN cell.
                           # Below 100 GB per GPU the launcher passes 2 instead (scripts/campaign/arms.sh).
num_steps: 28610
hf_export_steps: []
gradient_checkpointing: true
ac_mode: selective
fused_ce: true
compile: false
fp8: false
bf16: true
save_interval: 1192
save_total_limit: null
seed: 11785
hf_save_dir:   workspace/hf/qwen35_m_kda
ckpt_root_dir: workspace/ckpts
log_root_dir:  workspace/logs
model:
  vocab_size: 32000
  d_model: 2048
  n_layers: 24
  n_heads: 16
  n_kv_heads: 4
  head_dim: 128
  max_seq_len: 8192
  layer_mixers: [kda, kda, kda, gqa]
  kda_expand_v: 1.0
  kda_conv_size: 4
  kda_allow_neg_eigval: false
  kda_safe_gate: false
  intermediate_size: 8064
  gdn_head_dim: 128
  gdn_num_heads: 16
  attn_output_gate: true
  partial_rotary_factor: 0.25
  qk_norm: true
  attn_impl: sdpa
  rope_theta: 10000000
  norm_eps: 1.0e-6
  tie_embeddings: true
  z_loss_weight: 1.0e-4
optim:
  lr: 2.4e-3
  betas: [0.9, 0.95]
  weight_decay: 0.1
  max_grad_norm: 1.0
  lr_scheduler_type: wsd
  warmup_ratio: 0.0333
  decay_ratio: 0.2
  decay_type: linear
data:
  paths:       workspace/data/nemotron_cc_v2d1_hq_dqa/nemotron_rs_train.bin
  doc_lengths: workspace/data/nemotron_cc_v2d1_hq_dqa/nemotron_rs_train.doc_lengths.npy
  dtype: uint16
  position_mode: packed
  seed: 11785
