# 3:1 KDA (Kimi Delta Attention) : GQA hybrid at 5.293 B, the KDA twin of the 5.289 B GatedDeltaNet : GQA cell
# (qwen35_l.yaml). 2026-11-08.
#
# EVERYTHING BUT THE RECURRENT MIXER AND THE FFN WIDTH IS qwen35_l.yaml: d_model 3072, 32 layers (24 KDA + 8 attention,
# every 4th layer attention), the same attention (16 q / 4 kv at head_dim 256, output gate, partial rotary 0.25, qk_norm),
# the 32k vocabulary with tied embeddings, and the same budget (GBS 128 x 8192 tokens x 28,610 steps = 30.0 B tokens),
# WSD schedule, LR and data order. head_dim stays 256, the ladder's one kernel invariant (qwen35_l.yaml header): the fp8
# arms run the head_dim-256 Delta-Matching kernel and the Standard arm FlashAttention-3 bf16, as the l_*_hd256 arms do.
#
# KDA LAYERS follow Kimi Linear (Moonshot, 2025): 32 heads x 128, value width = key width (fla's KDA default expand_v 1),
# short conv 4, no RoPE in the recurrent layers. key_dim = value_dim = 4096 (1.33 d). A KDA layer carries 52.3 M
# parameters against the l_ GDN layer's 88.3 M (16 QK / 32 V heads, value_dim 8192 through expand_v 2). The recurrent
# state per layer is 32 x 128 x 128, half the l_ GDN's 32 x 128 x 256: the same KDA : GDN state ratio as the 1.665 B
# twins (qwen35_m_kda.yaml against qwen35_m.yaml).
#
# PARAMETER MATCHING (the campaign's method, as in qwen35_m_kda.yaml): the FFN widens from 9216 (3.0 d) to 12160 (3.96 d;
# Kimi Linear's dense FFN is 4.0 d, the 1.665 B KDA twin's 3.94 d). Total 5,292,698,368 against the GDN cell's
# 5,288,573,440 (+0.078 %). The KDA projections stay bf16 in every arm (the fp8 scope filter excludes the `.kda.` module,
# modeling/kda.py), as the GDN projections do in qwen35_l.
#
# LR 2.4e-3, the GDN cell's rate: see the LR note in qwen35_l.yaml. Early-training probe (30 steps on the WSD horizon,
# 2026-11-08): this cell shows grad-norm spikes (80-220, CE spikes to 12-14) at steps 4-20 (LR < 1e-4) that recover by
# about step 25, in every variant tried (fp8 off, the safe gate with lower_bound -5, 16 heads, the GDN cell's 16 qk /
# 32 v heads at expand_v 2); qwen35_l.yaml and the 1.665 B qwen35_m_kda.yaml are smooth at this schedule, and LR 1.2e-3
# halves the spikes. The campaign runs 2.4e-3 with a clean-arm hedge at 1.2e-3 (TAG=_lr1p2e3 DM_LR=1.2e-3) through the
# warmup; scripts/experiments/stage1_l_kda.sh. Outcome (full run, 16 GPUs, 2026-11-09): the step-10 spikes were mild
# (grad norm 29-36 at 2.4e-3, 86 at 1.2e-3) and gone by step 40; from the end of the warmup (step 953) to step 2000 the
# 2.4e-3 arms showed no CE or grad-norm spike (grad norm median 0.11, max 0.28) and the 2.4e-3 clean arm led the hedge
# by 0.013-0.020 nats, so all arms keep 2.4e-3 and the hedge was stopped at step 2004.
# Arms (scripts/campaign/arms.sh): l_kda_clean_hd256, l_kda_dm_stale_hd256, l_kda_dm_matched_hd256.
run_name: qwen35_l_kda
backend: fsdp2

global_batch_size: 128
per_device_batch_size: 1        # 5.3B at 8k -> ga 16 (GBS 128 exact)
num_steps: 28610                # the same horizon as qwen35_l.yaml => the same 30.0 B-token budget
hf_export_steps: []

gradient_checkpointing: true
ac_mode: selective
fused_ce: true
compile: false
fp8: false
bf16: true

save_interval: 1192
save_total_limit: null
seed: 11785
hf_save_dir:   workspace/hf/qwen35_l_kda
ckpt_root_dir: workspace/ckpts
log_root_dir:  workspace/logs

model:
  vocab_size: 32000             # the campaign's Llama-2 32k ids (qwen35_l.yaml)
  d_model: 3072
  n_layers: 32
  n_heads: 16
  n_kv_heads: 4
  head_dim: 256
  max_seq_len: 8192
  layer_mixers: [kda, kda, kda, gqa]
  intermediate_size: 12160      # 3.96 * d_model: parameter parity with qwen35_l.yaml (see the header)
  kda_head_dim: 128
  kda_num_heads: 32             # Kimi Linear's KDA geometry: 32 heads x 128
  kda_expand_v: 1.0             # value width = key width (Kimi Linear; fla's KDA default)
  kda_conv_size: 4
  kda_allow_neg_eigval: false
  kda_safe_gate: false
  attn_output_gate: true
  partial_rotary_factor: 0.25
  qk_norm: true
  attn_impl: sdpa
  rope_theta: 10000000
  norm_eps: 1.0e-6
  tie_embeddings: true
  z_loss_weight: 1.0e-4

optim:
  lr: 2.4e-3                     # qwen35_l.yaml's rate
  betas: [0.9, 0.95]
  weight_decay: 0.1
  max_grad_norm: 1.0
  lr_scheduler_type: wsd
  warmup_ratio: 0.0333
  decay_ratio: 0.2
  decay_type: linear

data:
  paths:       workspace/data/nemotron_cc_v2d1_hq_dqa/nemotron_rs_train.bin
  doc_lengths: workspace/data/nemotron_cc_v2d1_hq_dqa/nemotron_rs_train.doc_lengths.npy
  dtype: uint16
  position_mode: packed
  seed: 11785
